name: Build & deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  # The full generator check: 200 seeds per room and tier = 14,000 levels (locally it is 30).
  VALIDATE_SEEDS: "200"

jobs:
  build:
    name: Check & export
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/ ~/.config/
          if [ -d /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ] && [ ! -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable ]; then
            mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/
          fi
          if [ -d /root/.config/godot ] && [ ! -d ~/.config/godot ]; then mv /root/.config/godot ~/.config/godot; fi
          ls ~/.local/share/godot/export_templates/
          godot --version

      - name: Checks and exports (tools/check.sh)
        run: bash tools/check.sh

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: check-logs
          path: builds/logs
          if-no-files-found: ignore

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: sunrise-suite-windows
          path: builds/windows

      - name: Upload Web build
        uses: actions/upload-artifact@v7
        with:
          name: sunrise-suite-web
          path: builds/web

      - name: Package web build for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: builds/web

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
